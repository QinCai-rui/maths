<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%sveltekit.status% · Raymont's Maths</title>
    <style>
      :root {
        color-scheme: light dark;
        --paper: #f3f4ee;
        --foreground: #191c16;
        --muted-foreground: #62695f;
        --line-strong: #aeb5a0;
        --viridian: #1f6b57;
        --viridian-deep: #0c4234;
        --on-viridian: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #171b17;
          --foreground: #edf0e8;
          --muted-foreground: #adb6a8;
          --line-strong: #596557;
          --viridian: #74bea1;
          --viridian-deep: #10241b;
          --on-viridian: #10241b;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--foreground);
        font-family: "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      main {
        box-sizing: border-box;
        width: min(1120px, 100%);
        margin-inline: auto;
        padding: clamp(3rem, 9vw, 7rem) clamp(1rem, 4vw, 2.5rem);
      }
      .code {
        margin: 0 0 0.5rem;
        color: var(--line-strong);
        font-family: "Fraunces", Georgia, serif;
        font-size: clamp(5.5rem, 22vw, 11rem);
        font-weight: 600;
        line-height: 0.9;
        letter-spacing: -0.04em;
      }
      .eyebrow {
        margin: 0 0 1rem;
        color: var(--viridian);
        font-family: "Fraunces", Georgia, serif;
        font-size: 1.05rem;
        font-style: italic;
      }
      h1 {
        max-width: 14ch;
        margin: 0;
        font-family: "Fraunces", Georgia, serif;
        font-size: clamp(2.2rem, 6vw, 3.5rem);
        font-weight: 600;
        line-height: 1.02;
        letter-spacing: -0.03em;
      }
      p.lead {
        max-width: 47ch;
        margin: 1.4rem 0 0;
        color: var(--muted-foreground);
        font-size: 1.1rem;
      }
      .actions {
        margin-top: 1.8rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 2.85rem;
        padding: 0.65rem 1.05rem;
        border: 1px solid var(--viridian-deep);
        border-radius: 3px;
        background: var(--viridian);
        color: var(--on-viridian);
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        background: var(--viridian-deep);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">%sveltekit.status%</p>
      <p class="eyebrow">Something went wrong</p>
      <h1>Site unavailable</h1>
      <p class="lead">%sveltekit.error.message%</p>
      <p class="actions"><a href="/">Go home</a></p>
    </main>
  </body>
</html>
